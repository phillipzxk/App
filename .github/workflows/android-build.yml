# Checks that the Android version of the app still builds.
# Runs when the Android setup or the app's packages change, or by hand.
name: Android-Version bauen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'code/android/**'
      - 'code/pubspec.yaml'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
