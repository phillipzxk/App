# Checks that the iPhone version of the app still builds (without signing).
# Runs when the iOS setup or the app's packages change, or by hand.
name: iPhone-Version bauen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'code/ios/**'
      - 'code/pubspec.yaml'
      - '.github/workflows/iphone-build.yml'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
