<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Groundset – dein Coach für Training, Essen, Schlaf und Kopf.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#110E0B">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Groundset">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Groundset</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#110E0B">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Web Push for the Privatcoach chat. Flutter calls these.
    window.groundsetPush = {
      status: function () {
        var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
        var daheim = window.matchMedia('(display-mode: standalone)').matches ||
          navigator.standalone === true;
        if (!('serviceWorker' in navigator) || !('PushManager' in window) ||
            !('Notification' in window)) {
          return ios && !daheim ? 'homescreen' : 'aus';
        }
        if (Notification.permission === 'denied') return 'blockiert';
        return Notification.permission === 'granted' ? 'erlaubt' : 'frage';
      },
      an: async function (schluessel) {
        var r = await Notification.requestPermission();
        if (r !== 'granted') return null;
        var reg = await navigator.serviceWorker.register('groundset_sw.js');
        await navigator.serviceWorker.ready;
        var roh = atob(schluessel.replace(/-/g, '+').replace(/_/g, '/') +
          '='.repeat((4 - schluessel.length % 4) % 4));
        var key = new Uint8Array(roh.length);
        for (var i = 0; i < roh.length; i++) key[i] = roh.charCodeAt(i);
        var sub = await reg.pushManager.getSubscription() ||
          await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
        return JSON.stringify(sub.toJSON());
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
